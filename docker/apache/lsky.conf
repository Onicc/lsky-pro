ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
ServerLimit 24
MaxRequestWorkers 24
MaxConnectionsPerChild 1000

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    ErrorLog /dev/stderr
    CustomLog /dev/stdout "%h %t \"%m %U %H\" %>s %b"
    LimitRequestBody 73400320
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    RewriteEngine On
    RewriteRule (?:^|/)\. - [R=404,END]
    RewriteRule ^/index\.php$ - [END]
    RewriteRule \.(?:php[0-9]*|phtml|phar)(?:/|$) - [NC,R=404,END]
    RewriteRule ^/(?:storage|thumbnails)(?:/|$) - [R=404,END]
    RewriteCond /var/www/html/public%{REQUEST_URI} -f
    RewriteRule ^/(?:(?:build|css|fonts|js)/.+|favicon\.ico|robots\.txt)$ - [END]
    RewriteRule ^/ /index.php [END]

    <Directory /var/www/html/public>
        AllowOverride None
        Options -Indexes -MultiViews -FollowSymLinks
        Require all granted
        AcceptPathInfo Off
        CGIPassAuth On
        DirectoryIndex disabled
    </Directory>
</VirtualHost>
