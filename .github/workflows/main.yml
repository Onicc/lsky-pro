name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build test image
        run: docker build --target development --tag lsky-pro:ci-development .
      - name: Run PHP tests
        run: >-
          docker run --rm
          -e APP_ENV=testing
          -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          -e DB_CONNECTION=sqlite
          -e DB_DATABASE=:memory:
          lsky-pro:ci-development php vendor/bin/phpunit
      - name: Audit production PHP dependencies
        run: docker run --rm lsky-pro:ci-development composer audit --locked --no-dev
      - name: Verify S3 and MinIO adapters
        run: scripts/test-object-storage.sh lsky-pro:ci-development
      - name: Audit JavaScript dependencies
        run: |
          docker build --target frontend-dependencies --tag lsky-pro:ci-frontend-audit .
          docker run --rm lsky-pro:ci-frontend-audit npm audit --audit-level=high
      - name: Build and smoke-test production image
        run: |
          docker build --tag lsky-pro:ci-production .
          scripts/smoke-container.sh lsky-pro:ci-production
          scripts/smoke-container.sh lsky-pro:ci-production mysql
          scripts/smoke-container.sh lsky-pro:ci-production pgsql
