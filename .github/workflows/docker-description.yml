name: Update Docker Hub description

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - docs/dockerhub-overview.md
      - .github/workflows/docker-description.yml

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update repository description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}"
          : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN is required}"
          namespace="${DOCKERHUB_USERNAME,,}"

          auth_response="$RUNNER_TEMP/dockerhub-auth.json"
          auth_status=$(jq -n --arg identifier "$namespace" --arg secret "$DOCKERHUB_TOKEN" \
            '{identifier: $identifier, secret: $secret}' \
            | curl --silent --show-error --retry 3 --max-time 15 --output "$auth_response" \
                --write-out '%{http_code}' -X POST 'https://hub.docker.com/v2/auth/token' \
                -H 'Content-Type: application/json' --data-binary @-)
          if [[ "$auth_status" != 200 ]]; then
            printf '::error title=Docker Hub authentication::Token request returned HTTP %s\n' "$auth_status"
            exit 1
          fi
          if ! jwt=$(jq -er '.access_token | select(type == "string" and length > 0)' "$auth_response"); then
            printf '::error title=Docker Hub authentication::Response did not contain an access token\n'
            exit 1
          fi
          printf '::add-mask::%s\n' "$jwt"
          description='自托管图床，支持 HEIC、批量上传、外链和 S3 兼容存储。'
          jq -n --arg description "$description" --rawfile full_description docs/dockerhub-overview.md \
            '{description: $description, full_description: $full_description}' > "$RUNNER_TEMP/dockerhub-description.json"

          updated=false
          for endpoint in \
            "https://hub.docker.com/v2/repositories/$namespace/lsky-pro/" \
            "https://hub.docker.com/v2/namespaces/$namespace/repositories/lsky-pro/"; do
            status=$(curl --silent --show-error --retry 3 --output "$RUNNER_TEMP/dockerhub-response.json" \
              --write-out '%{http_code}' -X PATCH "$endpoint" \
              -H "Authorization: Bearer $jwt" \
              -H 'Content-Type: application/json' \
              --data-binary @"$RUNNER_TEMP/dockerhub-description.json")
            printf 'Docker Hub update %s -> HTTP %s\\n' "$endpoint" "$status"
            if [[ "$status" == 200 || "$status" == 201 ]]; then
              updated=true
              break
            fi
          done
          if [[ "$updated" != true ]]; then
            printf '::error title=Docker Hub description::Update returned HTTP %s\n' "$status"
            exit 1
          fi

          result=$(curl --fail --silent --show-error --retry 3 \
            "https://hub.docker.com/v2/repositories/$namespace/lsky-pro/")
          jq -e --arg description "$description" --rawfile overview docs/dockerhub-overview.md \
            '.description == $description and ((.full_description | rtrimstr("\n")) == ($overview | rtrimstr("\n")))' \
            <<< "$result" >/dev/null
          printf 'Docker Hub description updated and verified.\\n'
